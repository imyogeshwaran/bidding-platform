        title: { type: string }
        message: { type: string }
        auctionId: { type: ["string", "null"] }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, type, title, message, read, createdAt]
    NotificationResult:
      type: object
      properties:
